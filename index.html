<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="A minimal dashboard for priorities, tasks, and focused work."
    >

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Minimal">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            script-src 'self';
            style-src 'self';
            img-src 'self' data:;
            connect-src 'self';
            worker-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
        "
    >

    <title>Minimal</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <h1>Minimal</h1>
        <p id="date-display"></p>
        <p id="time-display"></p>
        <p>Focus on what matters.</p>
        

        <section>
            <h2>Today</h2>
            <form id="priority-form">
                <input id="priority-input" type="text" placeholder="What matters most?">
                <button type="submit">Add</button>
            </form>

        <p id="priority-display"></p>
        <button id="clear-button" type="button">Clear priority</button>
        </section>
        <section>
    <h2>Checklist</h2>

    <form id="task-form">
        <input id="task-input" type="text" placeholder="Add a task">
        <button type="submit">Add task</button>
    </form>

    <ul id="task-list"></ul>
    <button id="clear-tasks-button" type="button">Clear checklist</button>
</section>
<section>
    <h2>Focus</h2>
    <p id="timer-display">25:00</p>
    <button id="start-timer-button" type="button">Start</button>
    <button id="reset-timer-button" type="button">Reset</button>
</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
